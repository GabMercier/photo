# =============================================================================
# Sveltia CMS Configuration (English)
# =============================================================================

backend:
  name: github
  repo: GabMercier/photo
  branch: main
  base_url: https://gphoto.pages.dev
  auth_endpoint: /auth

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

locale: "en"

collections:

  # ==========================================================================
  # Posts
  # ==========================================================================
  - name: "posts"
    label: "Posts"
    label_singular: "Post"
    folder: "src/content/posts"
    create: true
    slug: "{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}"
    extension: "md"
    identifier_field: "date"
    summary: "{{date}} — {{title.en}}"
    sortable_fields: ["date", "title.en"]
    thumbnail: "coverImage.src"
    view_filters:
      - label: "Homepage Carousel"
        field: "homepageCarousel"
        pattern: true
      - label: "Featured"
        field: "featured"
        pattern: true
      - label: "Private"
        field: "private"
        pattern: true
      - label: "Series"
        field: "postType"
        pattern: "series"

    fields:
      # --- Title (optional, for display) ---
      - label: "Title (optional)"
        name: "title"
        widget: "object"
        required: false
        collapsed: true
        preview: false
        summary: "{{fields.en}}"
        hint: "Optional - if not provided, post displays without title"
        fields:
          - label: "English"
            name: "en"
            widget: "string"
            required: false
          - label: "Français"
            name: "fr"
            widget: "string"
            required: false

      # --- Cover Image / Image principale ---
      - label: "Cover Image"
        name: "coverImage"
        widget: "object"
        fields:
          - label: "Image"
            name: "src"
            widget: "image"
          - label: "Alt Text"
            name: "alt"
            widget: "object"
            required: false
            collapsed: true
            fields:
              - label: "English"
                name: "en"
                widget: "string"
                required: false
              - label: "Français"
                name: "fr"
                widget: "string"
                required: false
          - label: "Crop Position"
            name: "focalPoint"
            widget: "select"
            required: false
            default: "center"
            hint: "For landscape images: which part to show in portrait view"
            options:
              - label: "Left"
                value: "left"
              - label: "Center (Recommended)"
                value: "center"
              - label: "Right"
                value: "right"

      # --- Glow Color (auto-extracted, editable) ---
      - label: "Glow Color"
        name: "glowColor"
        widget: "color"
        required: false
        preview: false
        hint: "Auto-extracted from image. Override manually if needed."

      # --- Secondary Colors (next to image for easy picking) ---
      - label: "Secondary Colors"
        name: "secondaryColors"
        widget: "list"
        required: false
        preview: false
        hint: "Accent colors for glow effects & color filtering. Add as many as needed."
        field:
          label: "Color"
          name: "color"
          widget: "color"

      - label: "Description"
        name: "description"
        widget: "object"
        required: false
        collapsed: true
        preview: false
        fields:
          - label: "English"
            name: "en"
            widget: "string"
            required: false
          - label: "Français"
            name: "fr"
            widget: "string"
            required: false

      - label: "Date"
        name: "date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        preview: false

      - label: "Date Taken (EXIF)"
        name: "dateTaken"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        required: false
        preview: false
        hint: "Auto-filled from photo EXIF data. Use to compare against publication date."

      # --- Location (where the photo was made) ---
      - label: "Location"
        name: "location"
        widget: "object"
        required: false
        collapsed: true
        preview: false
        summary: "{{fields.name}} {{fields.city}} {{fields.region}} {{fields.country}}"
        hint: "Where the photo was made. The import script fills this from Lightroom's location fields. Country as a 2-letter ISO code (CA, US, FR, IS…) so it is translated on both sites."
        fields:
          - label: "Place / Spot"
            name: "name"
            widget: "string"
            required: false
            hint: "Sublocation: Vieux-Québec, Quai de Baie-Saint-Paul…"
          - label: "City"
            name: "city"
            widget: "string"
            required: false
          - label: "Region / Province"
            name: "region"
            widget: "string"
            required: false
          - label: "Country (ISO code)"
            name: "country"
            widget: "string"
            required: false
            hint: "CA, US, FR, IS…"
          - label: "Latitude"
            name: "lat"
            widget: "number"
            value_type: "float"
            required: false
            min: -90
            max: 90
            step: 0.0001
          - label: "Longitude"
            name: "lng"
            widget: "number"
            value_type: "float"
            required: false
            min: -180
            max: 180
            step: 0.0001

      # --- Project (trip, place or body of work) ---
      - label: "Project"
        name: "project"
        widget: "relation"
        collection: "projects"
        search_fields: ["title.en", "title.fr"]
        value_field: "{{slug}}"
        display_fields: ["title.en"]
        required: false
        preview: false
        hint: "Groups this post with others from the same trip, place or body of work (see the Projects collection). A multi-image post is a different thing: see Post Type."

      - label: "Tags"
        name: "tags"
        widget: "relation"
        preview: false
        collection: "tags"
        search_fields: ["en", "fr"]
        value_field: "{{slug}}"
        display_fields: ["en"]
        multiple: true
        required: false

      - label: "Post Type"
        name: "postType"
        widget: "select"
        preview: false
        options:
          - label: "Single Image"
            value: "single"
          - label: "Series"
            value: "series"
        default: "single"

      - label: "Gallery Size"
        name: "gallerySize"
        widget: "select"
        preview: false
        hint: "Controls image size in gallery grid (desktop only)"
        options:
          - label: "Auto (detect from aspect ratio)"
            value: "auto"
          - label: "Small (1×1)"
            value: "small"
          - label: "Portrait (1×2 tall)"
            value: "portrait"
          - label: "Portrait Tall (1×3 extra tall)"
            value: "portrait-tall"
          - label: "Landscape (2×1 wide)"
            value: "landscape"
          - label: "Featured (2×2 large)"
            value: "featured"
        default: "auto"

      - label: "Draft"
        name: "draft"
        widget: "boolean"
        default: false
        preview: false

      - label: "Private"
        name: "private"
        widget: "boolean"
        default: false
        preview: false

      - label: "Featured"
        name: "featured"
        widget: "boolean"
        default: false
        preview: false

      - label: "Show in Carousel"
        name: "homepageCarousel"
        widget: "boolean"
        default: false
        preview: false

      - label: "Default Carousel Slide"
        name: "homepageDefault"
        widget: "boolean"
        default: false
        preview: false

      - label: "3D Depth Effect"
        name: "depth3d"
        widget: "boolean"
        default: false
        preview: false
        hint: "Enable parallax depth effect on post page"

      - label: "EXIF Summary (auto)"
        name: "exifSummary"
        widget: "string"
        required: false
        preview: false
        hint: "Auto-generated from photo EXIF data. Do not edit manually."

      - label: "Show EXIF Data"
        name: "showExif"
        widget: "boolean"
        default: false
        preview: false
        hint: "Display camera info on post page"

      - label: "EXIF Fields"
        name: "exifFields"
        widget: "select"
        multiple: true
        required: false
        preview: false
        default: ["camera", "lens", "focalLength", "aperture", "shutterSpeed", "iso"]
        hint: "Which EXIF fields to show (all by default)"
        options:
          - label: "Camera"
            value: "camera"
          - label: "Lens"
            value: "lens"
          - label: "Focal Length"
            value: "focalLength"
          - label: "Aperture"
            value: "aperture"
          - label: "Shutter Speed"
            value: "shutterSpeed"
          - label: "ISO"
            value: "iso"
          - label: "Date Taken"
            value: "dateTaken"

      - label: "EXIF Overrides"
        name: "exifOverrides"
        widget: "object"
        required: false
        collapsed: true
        preview: false
        hint: "Manual overrides for missing EXIF data (e.g., manual/vintage lenses)"
        fields:
          - label: "Camera"
            name: "camera"
            widget: "string"
            required: false
          - label: "Lens"
            name: "lens"
            widget: "string"
            required: false
            hint: "e.g., Nikkor 50mm f/1.4 AI-S"
          - label: "Focal Length"
            name: "focalLength"
            widget: "string"
            required: false
            hint: "e.g., 50mm"
          - label: "Aperture"
            name: "aperture"
            widget: "string"
            required: false
            hint: "e.g., f/2.8"
          - label: "Shutter Speed"
            name: "shutterSpeed"
            widget: "string"
            required: false
            hint: "e.g., 1/500"
          - label: "ISO"
            name: "iso"
            widget: "string"
            required: false

      - label: "Additional Images"
        name: "images"
        widget: "list"
        required: false
        collapsed: true
        preview: false
        label_singular: "Image"
        summary: "{{fields.alt.en}}"
        fields:
          - label: "Image"
            name: "src"
            widget: "image"
          - label: "Alt Text"
            name: "alt"
            widget: "object"
            fields:
              - label: "English"
                name: "en"
                widget: "string"
              - label: "Français"
                name: "fr"
                widget: "string"
          - label: "Camera"
            name: "camera"
            widget: "string"
            required: false
          - label: "Lens"
            name: "lens"
            widget: "string"
            required: false
            hint: "e.g., Nikkor 50mm f/1.4 AI-S"
          - label: "Focal Length"
            name: "focalLength"
            widget: "string"
            required: false
            hint: "e.g., 50mm"
          - label: "Aperture"
            name: "aperture"
            widget: "string"
            required: false
            hint: "e.g., f/2.8"
          - label: "Shutter Speed"
            name: "shutterSpeed"
            widget: "string"
            required: false
            hint: "e.g., 1/500"
          - label: "ISO"
            name: "iso"
            widget: "string"
            required: false
            hint: "e.g., f/2.8 · 1/500s · ISO 100"

      - label: "Body"
        name: "body"
        widget: "markdown"
        required: false
        preview: false

  # ==========================================================================
  # Tags
  # ==========================================================================
  - name: "tags"
    label: "Tags"
    label_singular: "Tag"
    folder: "src/data/tags"
    create: true
    slug: "{{slug}}"
    extension: "md"
    identifier_field: "en"
    summary: "{{en}} / {{fr}}"
    fields:
      - label: "English"
        name: "en"
        widget: "string"
      - label: "Français"
        name: "fr"
        widget: "string"

  # ==========================================================================
  # Projects
  # ==========================================================================
  - name: "projects"
    label: "Projects"
    label_singular: "Project"
    folder: "src/content/projects"
    create: true
    slug: "{{title.en}}"
    extension: "md"
    summary: "{{title.en}} / {{title.fr}}"
    sortable_fields: ["title.en", "kind"]
    thumbnail: "coverImage.src"
    view_filters:
      - label: "Travel"
        field: "kind"
        pattern: "travel"
      - label: "Hyperlocal"
        field: "kind"
        pattern: "local"
      - label: "Astro"
        field: "kind"
        pattern: "astro"
      - label: "Featured"
        field: "featured"
        pattern: true
    fields:
      - label: "Title"
        name: "title"
        widget: "object"
        summary: "{{fields.en}}"
        hint: "The English title also gives the URL slug (projects/charlevoix-2025)."
        fields:
          - label: "English"
            name: "en"
            widget: "string"
          - label: "Français"
            name: "fr"
            widget: "string"

      - label: "Description"
        name: "description"
        widget: "object"
        required: false
        collapsed: true
        hint: "Short intro shown under the title. Use the Body for a longer text."
        fields:
          - label: "English"
            name: "en"
            widget: "text"
            required: false
          - label: "Français"
            name: "fr"
            widget: "text"
            required: false

      - label: "Kind"
        name: "kind"
        widget: "select"
        default: "other"
        hint: "Shown as a small badge. Other shows nothing."
        options:
          - label: "Travel"
            value: "travel"
          - label: "Hyperlocal"
            value: "local"
          - label: "Astro"
            value: "astro"
          - label: "Other"
            value: "other"

      # --- Location (where the photo was made) ---
      - label: "Location"
        name: "location"
        widget: "object"
        required: false
        collapsed: true
        preview: false
        summary: "{{fields.name}} {{fields.city}} {{fields.region}} {{fields.country}}"
        hint: "Where the photo was made. The import script fills this from Lightroom's location fields. Country as a 2-letter ISO code (CA, US, FR, IS…) so it is translated on both sites."
        fields:
          - label: "Place / Spot"
            name: "name"
            widget: "string"
            required: false
            hint: "Sublocation: Vieux-Québec, Quai de Baie-Saint-Paul…"
          - label: "City"
            name: "city"
            widget: "string"
            required: false
          - label: "Region / Province"
            name: "region"
            widget: "string"
            required: false
          - label: "Country (ISO code)"
            name: "country"
            widget: "string"
            required: false
            hint: "CA, US, FR, IS…"
          - label: "Latitude"
            name: "lat"
            widget: "number"
            value_type: "float"
            required: false
            min: -90
            max: 90
            step: 0.0001
          - label: "Longitude"
            name: "lng"
            widget: "number"
            value_type: "float"
            required: false
            min: -180
            max: 180
            step: 0.0001

      - label: "Cover Image"
        name: "coverImage"
        widget: "object"
        required: false
        collapsed: true
        hint: "Optional. Without it, the featured or newest post of the project is used."
        fields:
          - label: "Image"
            name: "src"
            widget: "image"
          - label: "Alt Text"
            name: "alt"
            widget: "object"
            required: false
            fields:
              - label: "English"
                name: "en"
                widget: "string"
                required: false
              - label: "Français"
                name: "fr"
                widget: "string"
                required: false

      - label: "Featured"
        name: "featured"
        widget: "boolean"
        default: false
        hint: "Listed first on the Projects page."

      - label: "Draft"
        name: "draft"
        widget: "boolean"
        default: false

      - label: "Body"
        name: "body"
        widget: "markdown"
        required: false
        hint: "Longer introduction shown on the project page, above the photos."

  # ==========================================================================
  # About
  # ==========================================================================
  - name: "about"
    label: "About"
    files:
      - name: "about"
        label: "About"
        file: "src/content/about/about.md"
        fields:
          - label: "Profile Image"
            name: "profileImage"
            widget: "object"
            fields:
              - label: "Image"
                name: "src"
                widget: "image"
              - label: "Alt Text"
                name: "alt"
                widget: "object"
                fields:
                  - label: "English"
                    name: "en"
                    widget: "string"
                  - label: "Français"
                    name: "fr"
                    widget: "string"

          - label: "Tagline"
            name: "tagline"
            widget: "object"
            required: false
            fields:
              - label: "English"
                name: "en"
                widget: "string"
              - label: "Français"
                name: "fr"
                widget: "string"

          - label: "Contact"
            name: "contact"
            widget: "object"
            required: false
            collapsed: true
            fields:
              - label: "Email"
                name: "email"
                widget: "string"
                required: false
              - label: "Instagram"
                name: "instagram"
                widget: "string"
                required: false
                hint: "Without @"
              - label: "Twitter"
                name: "twitter"
                widget: "string"
                required: false
                hint: "Without @"

          - label: "Bio"
            name: "bio"
            widget: "object"
            fields:
              - label: "English"
                name: "en"
                widget: "markdown"
              - label: "Français"
                name: "fr"
                widget: "markdown"
